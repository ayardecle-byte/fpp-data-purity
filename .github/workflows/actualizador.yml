name: Actualizador Automático de Data Purity

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar los Scrapers (Extrayendo Datos)
        run: |
          python actualizar_todo.py

      - name: 💾 Guardar los nuevos datos (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data_json/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Datos actualizados automáticamente (CRON)" && git push)
